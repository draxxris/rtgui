[tools]
go = "1.27"
"go:github.com/fzipp/gocyclo/cmd/gocyclo" = "0.6.0"

[tasks.test]
description = "Run headless unit tests"
run = "go test ./..."

[tasks.vet]
description = "Vet all packages"
run = "go vet ./..."

[tasks.gallery]
description = "Run the widget gallery example"
run = "go run ./examples/widget_gallery"

[tasks.build-linux]
description = "Build the widget gallery for Linux into dist/"
run = "mkdir -p dist && go build -o dist/widget-gallery-linux ./examples/widget_gallery"

[tasks.build-windows]
description = "Cross-compile the widget gallery for Windows into dist/ (needs mingw-w64)"
run = "mkdir -p dist && env GOOS=windows GOARCH=amd64 CGO_ENABLED=1 CC=x86_64-w64-mingw32-gcc go build -o dist/widget-gallery.exe ./examples/widget_gallery"

[tasks.complexity]
description = "Check for cyclomatic complexity"
run = "gocyclo -over 15 `find . -name '*.go' -type f`"
